<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8f5ee">
    <meta name="description" content="Rosalies Zahlenland: das Einmaleins, Teilen und Malnehmen üben – mit verständlichen Aufgaben, Denktipps und Hilfe in kleinen Schritten.">
    <title>Rosalies Zahlenland · Version 18</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='19' fill='%23a55486'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='43'%3E%F0%9F%8C%9F%3C/text%3E%3C/svg%3E">
    <style>
:root {
  color-scheme: light;
  --paper: #f8f5ee;
  --ink: #243833;
  --muted: #668079;
  --forest: #27685f;
  --forest-dark: #1e544c;
  --line: #e3e7df;
  --coral: #f7aa87;
  --lavender: #e8e2fa;
  --mint: #e0f2e7;
  --sun: #ffd77c;
  --white: #fffdfa;
  font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-synthesis: none;
}
* {box-sizing: border-box}
html {min-height: 100%; background: var(--paper)}
body {margin: 0; color: var(--ink); background: radial-gradient(ellipse at top left, #fff8e5 0%, transparent 44%), var(--paper); min-height: 100vh}
button, select {font: inherit}
button {cursor: pointer}
button:focus-visible, select:focus-visible {outline: 3px solid #297d8e; outline-offset: 4px}
.site-shell {max-width: 980px; padding: 0 24px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column}
.topbar {display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 23px 0 22px}
.brand {display: flex; align-items: center; gap: 10px; border: 0; background: none; text-align: left; color: var(--ink); padding: 0; font-size: 11px; letter-spacing: .09em; font-weight: 800; line-height: 1.5}
.brand b {display: block; letter-spacing: .075em; font-size: 15px}
.brand-icon {width: 39px; height: 39px; flex: 0 0 39px; border-radius: 14px; background: var(--forest); color: #fff; display: grid; place-items: center; font-size: 24px}
.topbar-note {display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--forest-dark); font-weight: 700; white-space: nowrap}
.note-dot {height: 8px; width: 8px; display: inline-block; background: #79bf87; border-radius: 50%}
main {flex: 1}
.hero {position: relative; display: grid; grid-template-columns: 1.25fr .75fr; align-items: center; min-height: 266px; padding: 40px 45px 42px; border-radius: 29px; background: var(--forest-dark); color: #fff; overflow: hidden; box-shadow: 0 14px 40px #1d534622}
.hero:before {content: ""; position: absolute; inset: auto -70px -125px 22%; height: 250px; border-radius: 50% 50% 0 0; background: #357e6c}
.hero:after {content: ""; position: absolute; inset: auto -55px -150px 51%; height: 245px; border-radius: 50% 50% 0 0; background: #47917b}
.hero-content {z-index: 1; position: relative; max-width: 560px}
.eyebrow {display: inline-flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; font-weight: 800; color: #d3f1db; margin-bottom: 15px}
h1, h2, h3, p {margin-top: 0}
.hero h1 {font-size: clamp(30px, 5vw, 47px); letter-spacing: -.035em; line-height: 1.13; margin: 0 0 13px; font-weight: 850}
.hero p {font-size: 16px; line-height: 1.55; color: #e5f3ec; max-width: 440px; margin: 0}
.hero-illustration {position: relative; height: 190px; z-index: 1}
.sun {position: absolute; top: 2px; right: 34px; width: 114px; height: 114px; background: #ffd980; border-radius: 50%; box-shadow: 0 0 0 14px #ffffff17}
.cloud {position: absolute; background: #e9fbf3; height: 21px; width: 82px; border-radius: 20px; opacity: .91; top: 28px; left: 5px}
.cloud:before {content: ""; position: absolute; height: 36px; width: 38px; border-radius: 50%; background: inherit; left: 15px; top: -17px}
.island {position: absolute; font-weight: 900; background: #fff7dd; color: #2c625a; width: 68px; height: 60px; border-radius: 45% 55% 48% 52%; box-shadow: 0 8px 0 #d4a863, 0 14px 25px #103f3580; display: grid; place-items: center; transform: rotate(-8deg)}
.island.a {left: 15px; top: 115px; font-size: 28px}
.island.b {left: 103px; top: 77px; transform: rotate(11deg); font-size: 30px}
.island.c {left: 190px; top: 128px; transform: rotate(-6deg); font-size: 28px}
.hero-star {position: absolute; top: 110px; left: 178px; color: #ffda8b; font-size: 26px}
.section-heading {display: flex; align-items: end; justify-content: space-between; gap: 12px; margin: 33px 0 18px}
.section-heading h2 {font-size: clamp(20px, 3.8vw, 26px); margin: 0; letter-spacing: -.035em}
.section-heading p {margin: 7px 0 0; font-size: 14px; color: var(--muted)}
.session-pill {background: #fff; border: 1px solid var(--line); border-radius: 99px; padding: 9px 13px; color: var(--forest-dark); font-size: 12px; font-weight: 800; white-space: nowrap}
.mode-grid {display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px}
.mode-card {position: relative; min-height: 205px; border: 1px solid #ece8dc; border-radius: 24px; padding: 24px 25px; text-align: left; background: var(--white); transition: transform .15s, box-shadow .15s; box-shadow: 0 5px 16px #1c3d3607; color: var(--ink)}
.mode-card:hover {transform: translateY(-3px); box-shadow: 0 13px 24px #1c3d3614}
.mode-card:active {transform: translateY(0)}
.mode-card.primary {background: var(--mint)}
.mode-card.multiply {background: #fff0df}
.mode-card.warmup {background: var(--lavender); min-height: 165px; grid-column: 1 / -1; display: flex; align-items: center; gap: 23px}
.mode-icon {height: 53px; width: 53px; display: grid; place-items: center; border-radius: 18px; font-size: 27px; background: #fff; box-shadow: 0 5px 15px #2a5f5012; margin-bottom: 21px}
.warmup .mode-icon {flex: 0 0 53px; margin: 0}
.mode-text {flex: 1}
.mode-card h3 {font-size: 23px; letter-spacing: -.03em; margin: 0 0 7px}
.mode-card p {color: #5f746e; font-size: 14px; line-height: 1.5; margin: 0}
.example {display: inline-block; margin-top: 11px; font-size: 14px; font-weight: 800; color: var(--forest-dark)}
.card-arrow {position: absolute; top: 25px; right: 22px; background: #ffffff95; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 19px}
.tip-banner {margin-top: 17px; display: flex; align-items: flex-start; gap: 15px; border: 1px solid #e7e7dd; border-radius: 19px; padding: 19px 23px; background: #fffdf8}
.tip-banner strong {font-size: 14px; display: block; margin: 0 0 4px}
.tip-banner p {font-size: 13px; line-height: 1.55; margin: 0; color: var(--muted)}
.tip-emoji {font-size: 22px}
.footer {padding: 30px 0 22px; color: #85958e; text-align: center; font-size: 12px}
.footer span {color: #df9a83}
.activity-top {display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 8px 0 25px}
.back {border: 0; color: var(--forest-dark); background: transparent; font-size: 14px; font-weight: 800; display: inline-flex; gap: 7px; align-items: center; padding: 10px 4px}
.round-count {font-size: 12px; font-weight: 800; color: #667e73}
.activity-heading {text-align: center; margin: 0 auto 26px; max-width: 660px}
.activity-heading .overline {font-weight: 800; color: var(--forest); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; display: block; margin-bottom: 9px}
.activity-heading h1 {font-size: clamp(27px, 5vw, 40px); line-height: 1.14; letter-spacing: -.04em; margin: 0 0 11px}
.activity-heading p {color: #65776e; font-size: 15px; line-height: 1.5; margin: 0}
.progress-track {max-width: 550px; display: flex; gap: 7px; margin: 0 auto 21px}
.progress-cell {height: 8px; border-radius: 10px; flex: 1; background: #e2e9df}
.progress-cell.done {background: #61b18e}
.progress-cell.current {background: var(--sun)}
.task-card {max-width: 640px; margin: auto; border-radius: 27px; border: 1px solid #e8e9df; background: var(--white); padding: 29px 38px 32px; box-shadow: 0 10px 40px #2852470b}
.task-equation {font-size: clamp(29px, 7vw, 43px); font-weight: 850; letter-spacing: -.045em; text-align: center; color: var(--forest-dark); margin: 2px auto 19px; font-variant-numeric: tabular-nums}
.step-badge {display: table; margin: 0 auto 13px; border-radius: 99px; padding: 7px 13px; background: #f2ebff; font-weight: 800; font-size: 11px; letter-spacing: .06em; color: #6750aa; text-transform: uppercase}
.step-title {text-align: center; font-size: 19px; margin: 0 0 7px; letter-spacing: -.025em}
.step-detail {text-align: center; color: var(--muted); line-height: 1.5; font-size: 14px; margin: 0 auto 23px; max-width: 460px}
.options {display: grid; gap: 10px; grid-template-columns: repeat(3, 1fr); margin: 12px 0 21px}
.option {min-height: 83px; border-radius: 17px; color: var(--ink); background: #f6f8f3; border: 2px solid #e8eee6; font-weight: 800; font-size: clamp(17px, 2.8vw, 23px); line-height: 1.25; font-variant-numeric: tabular-nums; padding: 10px; transition: background .12s, transform .12s}
.option:hover:not(:disabled) {background: #e4f2e8; transform: translateY(-2px)}
.option:active:not(:disabled) {transform: scale(.98)}
.option:disabled {cursor: default; opacity: .60}
.option.correct {background: #daf2df; border-color: #66b68d; color: #205d46; opacity: 1}
.support-row {display: flex; justify-content: center; min-height: 42px; align-items: center}
.hint-button {color: var(--forest); border: 0; background: none; padding: 10px; font-size: 14px; font-weight: 800; text-decoration: underline; text-underline-offset: 4px}
.hint-box {background: #fff6db; border: 1px solid #f1dc9c; border-radius: 16px; color: #66511e; padding: 14px 17px; font-size: 14px; line-height: 1.55; margin: 11px 0 16px}
.feedback {margin: 2px auto 16px; font-size: 14px; text-align: center; color: #87612c; line-height: 1.5; min-height: 20px}
.feedback.success {color: #276e50; font-weight: 800; font-size: 16px}
.continue {background: var(--forest); border: none; border-radius: 16px; color: #fff; min-height: 55px; padding: 14px 25px; font-size: 15px; font-weight: 800; box-shadow: 0 7px 0 #164b42; width: 100%}
.continue:hover {background: #1f5b51}
.continue:active {transform: translateY(3px); box-shadow: 0 4px 0 #164b42}
.equation-steps {background: #f3f7f3; padding: 14px; border-radius: 15px; color: #607a6e; text-align: center; font-size: 13px; margin: 2px 0 18px; line-height: 1.6; font-weight: 650}
.finish {text-align: center; max-width: 640px; margin: 36px auto; padding: 42px 30px 38px; background: #fffdf8; border: 1px solid var(--line); border-radius: 29px; box-shadow: 0 12px 32px #2a4e390b}
.finish-graphic {font-size: 78px; line-height: 1.1; margin-bottom: 17px}
.finish h1 {font-size: clamp(31px, 6vw, 44px); letter-spacing: -.05em; margin: 0 0 15px}
.finish p {color: var(--muted); line-height: 1.62; font-size: 16px; max-width: 480px; margin: 0 auto 22px}
.finish .continue {max-width: 300px}
.finish-signoff {background: #e8f5ea; padding: 13px 16px; border-radius: 14px; color: #35634c; margin-bottom: 22px; font-weight: 750; font-size: 13px}
.row-choose {max-width: 640px; margin: 0 auto 20px; padding: 13px 16px; background: #efeafd; border-radius: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px}
.row-choose label {font-size: 14px; font-weight: 800; color: #59498c}
.row-choose select {border: 1px solid #c9bdeb; border-radius: 12px; background: #fff; padding: 10px 14px; min-width: 135px; color: var(--ink); font-size: 15px; font-weight: 750}
.card-extra {font-size: 12px; color: #7a8b80; margin-top: 19px; text-align: center}
@media (max-width: 680px) {
  .site-shell {padding: 0 16px}
  .topbar {padding: 16px 0 17px}
  .topbar-note {display: none}
  .hero {padding: 29px 26px; grid-template-columns: 1fr; min-height: 200px}
  .hero p {max-width: 270px; font-size: 14px}
  .hero-illustration {position: absolute; right: -88px; bottom: -24px; height: 148px; width: 210px; opacity: .62}
  .sun {width: 76px; height: 76px; right: 75px; top: 0}
  .island {width: 55px; height: 48px}
  .island.a {top: 98px; left: 5px}
  .island.b {top: 63px; left: 73px}
  .island.c {top: 97px; left: 147px}
  .section-heading {margin: 26px 0 15px}
  .session-pill {display: none}
  .mode-grid {grid-template-columns: 1fr; gap: 11px}
  .mode-card {min-height: 150px; padding: 17px 19px}
  .mode-card h3 {font-size: 21px}
  .mode-icon {margin-bottom: 10px; height: 43px; width: 43px; font-size: 24px; border-radius: 14px}
  .mode-card.warmup {min-height: 120px; padding: 17px 19px; gap: 15px}
  .warmup .mode-icon {flex: 0 0 43px}
  .tip-banner {padding: 16px}
  .task-card {padding: 24px 17px 26px}
  .activity-top {margin-bottom: 20px}
  .activity-heading {margin-bottom: 20px}
  .task-equation {margin-bottom: 18px}
  .step-detail {margin-bottom: 18px}
  .options {gap: 8px}
  .option {font-size: 17px; border-radius: 14px; min-height: 77px; padding: 7px}
  .finish {padding: 33px 22px}
}
@media (max-width: 370px) {
  .site-shell {padding: 0 12px}
  .brand b {font-size: 13px}
  .hero h1 {font-size: 31px}
  .option {font-size: 15px}
  .row-choose {flex-direction: column; align-items: stretch}
}
@media (prefers-reduced-motion: reduce) {
  * {transition: none !important; animation: none !important}
}

/* Rosalie's gentle pastel garden and large, unambiguous current question. */
:root {
  --paper: #fcf7f9;
  --ink: #3f3141;
  --muted: #766b7d;
  --forest: #984978;
  --forest-dark: #803a65;
  --line: #efdfeb;
  --mint: #fbe3f0;
  --lavender: #eee3fa;
  --white: #fffefc;
}
body {background: radial-gradient(ellipse at top left,#fff0e1 0%,transparent 42%),var(--paper)}
.brand-icon {background:#a55486}
.topbar-note {color:#95517d}
.note-dot {background:#f4a1c5}
.hero.magic-hero {background:linear-gradient(125deg,#783f78,#b46e99 80%);box-shadow:0 14px 34px #793f7a20}
.hero.magic-hero:before {background:#d389ad;opacity:.70}
.hero.magic-hero:after {background:#eba9c8;opacity:.62}
.magic-heart {position:absolute;right:44px;top:20px;font-size:92px;filter:drop-shadow(0 8px 7px #5b2e4855);transform:rotate(-13deg)}
.magic-flower {position:absolute;left:20px;bottom:17px;font-size:79px;filter:drop-shadow(0 6px 8px #5b2e4850);transform:rotate(12deg)}
.magic-spark {position:absolute;right:9px;bottom:27px;font-size:47px}
.hero .eyebrow {color:#ffe7f7}
.hero p {color:#ffedf5}
.mode-card.primary {background:#fee7f1}
.mode-card.multiply {background:#fff0e8}
.mode-card.warmup {background:#f1e9fb}
.example {color:#874771}
.session-pill {color:#8e4678}
.tip-banner {background:#fffafd}
.activity-heading {margin-bottom:20px}
.activity-heading h1 {font-size:20px;letter-spacing:-.02em;font-weight:700;color:#807080}
.activity-heading .overline {color:#a6538a}
.progress-cell.current {background:#f1a3c9}
.progress-cell.done {background:#a468b0}
.updated-task {max-width:690px;padding:30px 36px 32px}
.updated-task .step-badge {background:#f8e3f3;color:#934d83}
.main-question {font-size:clamp(29px,4.5vw,41px);letter-spacing:-.045em;line-height:1.18;text-align:center;margin:4px auto 12px;max-width:580px;color:#76395f;font-weight:850}
.original-task {font-size:13px;color:#827889;text-align:center;margin:0 auto 15px}
.original-task strong {font-size:15px;color:#6a5369;letter-spacing:.01em}
.updated-task .step-detail {font-size:15px;color:#5e5265;font-weight:650;margin:0 auto 20px}
.story-panel {background:linear-gradient(125deg,#fff6e8,#fff0f7);border:1px solid #f2dfe8;border-radius:19px;padding:17px 18px 18px;margin:0 0 22px;text-align:center}
.story-heading {font-size:12px;font-weight:850;letter-spacing:.07em;text-transform:uppercase;color:#a34d82;margin-bottom:8px}
.story-panel p {font-size:15px;line-height:1.56;font-weight:650;max-width:560px;margin:0 auto 15px}
.story-scene {display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.pile {min-width:96px;min-height:68px;border:1px solid #edcddd;background:#fffefd;border-radius:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0;font-size:20px;padding:6px 10px}
.pile b {font-size:24px;font-variant-numeric:tabular-nums}
.pile small {font-size:11px;color:#8c7890}
.pile.pale {background:#fae8f8}
.story-arrow {color:#a95b96;font-size:23px;font-weight:800}
.baskets {display:flex;gap:5px;max-width:400px;flex-wrap:wrap;align-items:center;justify-content:center}
.recipient-stack {display:flex;flex-direction:column;align-items:center;gap:5px;max-width:400px}
.recipient-caption {font-size:12px;color:#84476e;font-weight:850}
.little-object {display:flex;align-items:center;justify-content:center;line-height:1;background:#fffefd;border:1px solid #f0d4e5;border-radius:11px;width:44px;height:49px}
.recipient-emoji {font-size:26px;line-height:1}
.recipient-graphic {display:inline-block;position:relative;flex:none}
.can-graphic {width:26px;height:31px;border:2px solid #4b9aa8;border-radius:6px 6px 9px 9px;background:linear-gradient(90deg,#bfeef3,#e3fafd 48%,#91d2df);box-shadow:inset 0 -3px 0 #81c8d6}
.can-graphic:before {content:"";position:absolute;left:-2px;right:-2px;top:-5px;height:9px;border:2px solid #4b9aa8;border-radius:50%;background:#c5f4fa}
.tray-graphic {width:32px;height:14px;border:3px solid #ba7595;border-top:5px solid #e8b0cb;border-radius:1px 1px 9px 9px;background:#ffe5f0;transform:rotate(-5deg)}
.table-graphic {width:33px;height:8px;border-radius:4px;background:#d694ad;box-shadow:0 2px 0 #965b79}
.table-graphic:before,.table-graphic:after {content:"";position:absolute;top:6px;width:4px;height:19px;background:#965b79;border-radius:0 0 2px 2px}
.table-graphic:before {left:4px}.table-graphic:after {right:4px}
.sheet-graphic {width:26px;height:30px;border:2px solid #ad85b7;background:radial-gradient(circle,#e588ba 0 3px,transparent 4px) 3px 3px / 12px 12px,#fff;border-radius:3px;color:#b15f9b;font-size:11px;padding-top:7px}
.coin-scene {display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px;max-width:440px;margin:auto}
.coin {height:40px;width:40px;border-radius:50%;border:2px solid #bb904a;box-shadow:inset 0 0 0 3px #fdf1c3;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;line-height:1.1;color:#694916;font-weight:850;background:#e6c16d}
.coin small {font-size:9px}
.hops {display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:450px;margin:auto}
.hop {height:45px;width:43px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:#ebccec;color:#884576;font-size:16px;font-weight:850;transform:rotate(-3deg)}
.hop:nth-child(2n) {background:#f8d9b4;transform:rotate(3deg)}
.hop small {font-size:10px}
.answer-section {display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px auto 17px}
.answer-label {font-size:12px;font-weight:800;color:#9b5081;letter-spacing:.05em;text-transform:uppercase}
.answer-screen {height:75px;min-width:200px;max-width:100%;padding:10px 25px;background:#fff;border:3px solid #e6c6db;border-radius:19px;display:grid;place-items:center;font-size:38px;line-height:1;font-weight:900;letter-spacing:.09em;color:#673554;font-variant-numeric:tabular-nums}
.answer-screen.solved {background:#e6f5e7;border-color:#78b88a;color:#246a4d}
.answer-placeholder {color:#d5b5cd}
.num-pad {display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:340px;margin:0 auto 14px}
.key {min-width:0;width:100%;height:58px;border-radius:15px;border:2px solid #efdfeb;background:#fff;color:#563b53;font-weight:850;font-size:24px;box-shadow:0 4px 0 #eddaeb;touch-action:manipulation}
.key:active {transform:translateY(2px);box-shadow:0 2px 0 #eddaeb}
.key.delete {background:#f5e8f4;color:#895279}
.key.check {background:#99517f;color:#fff;border-color:#99517f;box-shadow:0 4px 0 #673857}
.help-buttons {display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:11px 0 10px}
.help-button {border:0;border-radius:14px;padding:14px 8px;min-height:52px;font-size:14px;font-weight:850}
.help-button.thought {background:#fff1d8;color:#7c5a2e}
.help-button.magic {background:#eddcff;color:#6a4385}
.solved-magic {display:block;width:100%;margin:0 auto 15px}
.hint-box {background:#fff9e9;border-color:#f7dfa8;color:#624d27;text-align:left}
.magic-box {border-radius:17px;padding:16px 18px;background:linear-gradient(145deg,#f4e3fe,#fce9f2);border:1px solid #e6c9ef;color:#634477;margin:12px 0 16px;line-height:1.56;font-size:14px}
.magic-box strong {font-size:16px}

  const app = document.getElementById('app');
  const state = {
    screen:'home', mode:null, examples:[], current:0, steps:[], step:0,

  let audioContext=null;

  function playSound(kind) {
    if(!state.soundEnabled)return;
    try {
      const Audio=window.AudioContext||window.webkitAudioContext;
      if(!Audio)return;
      if(!audioContext)audioContext=new Audio();
      if(audioContext.state==='suspended')audioContext.resume();
      const now=audioContext.currentTime;
      const notes=kind==='success'?[{hz:659,at:0},{hz:880,at:.13}]:kind==='retry'?[{hz:330,at:0}]:[{hz:523,at:0}];
      for(const note of notes){
        const oscillator=audioContext.createOscillator();
        const volume=audioContext.createGain();
        oscillator.type='sine';oscillator.frequency.value=note.hz;
        volume.gain.setValueAtTime(.0001,now+note.at);
        volume.gain.linearRampToValueAtTime(.075,now+note.at+.015);
        volume.gain.exponentialRampToValueAtTime(.0001,now+note.at+.20);
        oscillator.connect(volume);volume.connect(audioContext.destination);
        oscillator.start(now+note.at);oscillator.stop(now+note.at+.21);
      }
    }catch(_) { /* If the browser has no sound support, the game still works. */ }
  }

  function loadProgress() {
    try {
      const data=JSON.parse(localStorage.getItem('rosalie-mathe-progress-v1'));
      if(data && typeof data==='object') return {
        div:Number(data.div)||0,mul:Number(data.mul)||0,tab:Number(data.tab)||0,
        skipped:{div:0,mul:0,tab:0,...(data.skipped||{})}

    } catch(_) { /* Memory may be unavailable. */ }
    return {div:0,mul:0,tab:0,skipped:{div:0,mul:0,tab:0}};
  }
  function saveProgress() {

  function shuffle(items) {
    const a=items.slice();
    for(let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }
  function randomInt(low,high) {return low+Math.floor(Math.random()*(high-low+1));}
  function loadRecent() {

  function exampleKey(mode,p) {return mode==='div'?`${p.n}:${p.d}`:`${p.a}x${p.b}`;}

  function generateCandidate(mode) {
    if(mode==='div') {
      const theme=DIV[randomInt(0,DIV.length-1)];
      const d=randomInt(3,9),q=randomInt(4,9)*10+randomInt(1,9),n=d*q;

    }

  function freshExample(mode,exclude=[]) {
    if(mode==='tab') {
      const used=new Set(exclude.map(p=>p.b));

      return {a:state.row,b:choices.find(n=>!used.has(n))||choices[0]};
    }
    const seen=new Set(state.recent[mode]);
    const blocked=new Set(exclude.map(p=>exampleKey(mode,p)));
    let candidate;
    for(let i=0;i<300;i++) {
      candidate=generateCandidate(mode);
      const key=exampleKey(mode,candidate);
      if(!blocked.has(key)&&!seen.has(key))break;
    }
    // With an exhausted history, keep the current session distinct.
    for(let i=0;i<300&&blocked.has(exampleKey(mode,candidate));i++)candidate=generateCandidate(mode);
    state.recent[mode]=[...state.recent[mode],exampleKey(mode,candidate)].slice(-35);
    try{localStorage.setItem('rosalie-mathe-recent-v1',JSON.stringify(state.recent));}catch(_){}

  function magicFor(mode,p) {

    if(a===4||b===4) return {title:'Doppelt doppelt!',text:'Verdopple die Zahl. Verdopple das Ergebnis noch einmal.'};

  function getSteps(mode,p) {

  function addDigit(s) {

  function check() {
    if(state.solved||state.screen!=='play')return;
    if(state.entry===''){state.feedback='Tippe eine Zahl ein. 🌷';render();return;}
    if(state.mode==='div')return checkDivision();
    if(state.mode==='mul')return checkMultiplication();
    const guess=Number(state.entry), step=state.steps[state.step];
    if(guess===step.answer) {
      state.solved=true;state.assisted=false;state.celebration++;
      state.feedback='Richtig! 💗';

      state.errors++;

  function divisionAdvance(phase,notice='') {

  function finishDivision() {

  // Each multiplication is a small calculation tree. Rosalie decides whether
  // to solve it directly or split a factor into tens and ones. The program
  // checks her reasoning, but never prescribes the first subproblem.
  function makeMulNode(a,b) {return {a,b,value:null,phase:'plan',axis:null,children:null};}
  function currentMulNode() {
    let node=state.multiplication.root;
    while(node.children){
      const unfinished=node.children.find(child=>child.value===null);
      if(!unfinished)break;
      node=unfinished;
    }
    return node;
  }
  function mulCanSplit(n) {return n>=11&&n%10!==0;}
  function mulAdvance(message='') {
    state.entry='';state.feedback=message;state.hintLevel=0;state.magicOpen=false;
    state.rescueOpen=false;state.rescueLevel=0;render();
  }
  function mulAction(action) {
    if(state.mode!=='mul'||state.solved||state.screen!=='play')return;
    const node=currentMulNode();
    if(action==='direct'&&node.phase==='plan')node.phase='answer';
    else if(action==='split'&&node.phase==='plan'&&(mulCanSplit(node.a)||mulCanSplit(node.b)))node.phase='factor';
    else if(action==='back'&&(node.phase==='factor'||node.phase==='answer'))node.phase='plan';
    else if(action==='back'&&node.phase==='pick')node.phase='factor';
    else if(action==='factor-a'&&node.phase==='factor'&&mulCanSplit(node.a)){node.axis='a';node.phase='pick';}
    else if(action==='factor-b'&&node.phase==='factor'&&mulCanSplit(node.b)){node.axis='b';node.phase='pick';}
    else return;
    mulAdvance();
  }
  function finishMultiplication() {
    const p=state.examples[state.current];
    state.solved=true;state.entry=String(p.a*p.b);
    state.feedback=state.multiplication.usedHelp?'Geschafft! Du hast die Teilrechnungen verbunden. 💗':'Richtig! Du hast deinen eigenen Rechenweg gefunden. 💗';
    state.celebration++;playSound('success');render();
  }
  function checkMultiplication() {
    const node=currentMulNode(),value=Number(state.entry);
    if(!Number.isSafeInteger(value)||value<0)return divisionWrong('Bitte gib eine ganze Zahl ein.');
    if(node.phase==='pick') {
      const n=node[node.axis],tens=Math.floor(n/10)*10,ones=n%10;
      if(value!==tens&&value!==ones)return divisionWrong(`Das wäre ein umständlicher Teil. Suche einen einfachen Weg mit den Zehnern und Einern von ${n}.`);
      const other=n-value;
      node.children=node.axis==='a'?[makeMulNode(value,node.b),makeMulNode(other,node.b)]:[makeMulNode(node.a,value),makeMulNode(node.a,other)];
      node.phase='sum';

  function checkDivision() {
    const p=state.examples[state.current],s=state.division;
    const value=Number(state.entry);
    if(!Number.isSafeInteger(value)||value<0)return divisionWrong('Bitte gib eine ganze Zahl ein.');
    if(s.phase==='choose') {
      if(value===s.prefix&&s.parts.length===0){
        s.picked=value;s.strategy='digits';
        return divisionAdvance('digit_first',`Du hast die ersten Ziffern gewählt. ${s.prefix} steht hier für ${s.prefix*10} – die Zehner zählen mit! 🌷`);
      }
      if(value<p.d)return divisionWrong(`Wähle eine Teilzahl ab ${p.d}. Dann passt ${p.d} mindestens einmal hinein.`);
      if(value>s.remaining)return divisionWrong(`Es sind nur noch ${s.remaining} da. Deine Teilzahl darf nicht größer sein.`);
      if(value%p.d!==0)return divisionWrong(`Für einen einfachen Rechenweg sollte sich dein Teil ohne Rest durch ${p.d} teilen lassen. Versuch es mit einer passenden Zehnerzahl.`);
      if(value!==s.remaining&&value%(10*p.d)!==0)return divisionWrong(`Mit ${value} müsstest du einen unnötig kleinen Teil abziehen. Wähle lieber eine Zahl, die ${p.d} mal einer glatten Zehnerzahl ist – oder beginne bei den ersten Ziffern.`);
      s.picked=value;
      return divisionAdvance('chunk_calculate','Du hast selbst einen Teil gewählt. Rechne ihn jetzt aus. 🌷');
    }
    if(s.phase==='chunk_calculate') {
      if(value!==Math.floor(s.picked/p.d))return divisionWrong(`Prüfe: Wie oft passt ${p.d} ganz in ${s.picked}?`);
      s.chunkQuotient=value;
      if(s.picked%p.d!==0)return divisionAdvance('chunk_inner_remainder','Du hast richtig geteilt. Bei deiner Teilzahl ist noch ein Rest übrig.');
      s.parts.push({n:s.picked,q:value,proposed:s.picked,rest:0});
      if(s.picked===s.remaining){
        s.remaining=0;
        return s.parts.length===1?finishDivision():divisionAdvance('final','Du hast alle Teile geteilt. Jetzt setzt du das Ganze zusammen!');
      }
      return divisionAdvance('chunk_remainder','Deine Teilrechnung stimmt! Wie viel bleibt übrig?');
    }
    if(s.phase==='chunk_inner_remainder') {
      const leftover=s.picked-s.chunkQuotient*p.d;
      if(value!==leftover)return divisionWrong(`Rechne ${s.picked} − (${p.d} × ${s.chunkQuotient}).`);
      const used=s.picked-value;
      s.parts.push({n:used,q:s.chunkQuotient,proposed:s.picked,rest:value});
      s.picked=used;
      return divisionAdvance('chunk_remainder','Du hast den Rest deiner Teilrechnung gefunden. Wie viel von der ganzen Zahl ist noch nicht aufgeteilt?');
    }
    if(s.phase==='chunk_remainder') {
      const left=s.remaining-s.picked;
      if(value!==left)return divisionWrong(`Überprüfe die Subtraktion: ${s.remaining} − ${s.picked} = ?`);
      s.remaining=left;s.picked=0;
      return divisionAdvance('choose','Richtig! Jetzt bestimmst du selbst den nächsten Teil.');
    }
    if(s.phase==='digit_first') {
      const digit=Math.floor(s.prefix/p.d);
      if(value!==digit)return divisionWrong(`Wie oft passt ${p.d} ganz in ${s.prefix}?`);
      s.firstDigit=value;
      return divisionAdvance('digit_product','Gut! Jetzt finde heraus, wie viele Zehner du damit verteilt hast.');
    }
    if(s.phase==='digit_product') {
      if(value!==p.d*s.firstDigit)return divisionWrong(`Prüfe: ${p.d} × ${s.firstDigit} = ?`);
      s.firstProduct=value;
      return divisionAdvance('digit_scale','Richtig! Die Anfangsziffern stehen für Zehner. Wie groß ist dein Teil wirklich?');
    }
    if(s.phase==='digit_scale') {
      if(value!==s.firstProduct*10)return divisionWrong(`Rechne ${s.firstProduct} × 10. Vergiss den Stellenwert nicht.`);
      s.scaledProduct=value;
      return divisionAdvance('digit_subtract','Genau. Ziehe jetzt diesen großen Teil von der ganzen Zahl ab.');
    }
    if(s.phase==='digit_subtract') {
      if(value!==p.n-s.scaledProduct)return divisionWrong(`Rechne ${p.n} − ${s.scaledProduct}.`);
      s.nextValue=value;
      return divisionAdvance('digit_last','Jetzt ist nur noch ein kleiner Rest zu teilen.');
    }
    if(s.phase==='digit_last') {
      if(value!==s.nextValue/p.d)return divisionWrong(`Überprüfe: Welche Zahl mal ${p.d} ergibt ${s.nextValue}?`);
      s.lastDigit=value;
      return divisionAdvance('final','Du hast beide Stellen ausgerechnet. Was ergibt die ganze Aufgabe?');
    }
    if(s.phase==='direct') {
      if(value!==p.n/p.d)return divisionWrong(`Prüfe mit der Umkehraufgabe: ${p.d} × deine Antwort müsste ${p.n} sein.`);
      return finishDivision();
    }
    if(s.phase==='final') {
      if(value!==p.n/p.d)return divisionWrong('Schau dir deine Teil-Ergebnisse an. Was ergeben sie zusammen?');
      return finishDivision();
    }
  }

      if(state.current>=state.examples.length)state.screen='finish';

      render();window.scrollTo({top:0,behavior:'instant'});return;

    if(state.step+1<state.steps.length){state.step++;resetStep();render();return;}
    if(state.mode==='tab') {
      if(state.tabDone.length>=state.examples.length)state.screen='finish';
      else {

        for(let i=0;i<state.examples.length;i++){

          if(!state.tabDone.includes(idx)){state.current=idx;break;}

  function multiplicationPlanLines(root) {
    const lines=[];
    function visit(node) {
      if(!node.children)return;
      const [left,right]=node.children;
      const formula=`${node.a} × ${node.b} = (${left.a} × ${left.b}) + (${right.a} × ${right.b})`;
      lines.push(node.value===null?formula:`${formula} = ${node.value}`);
      visit(left);visit(right);
    }
    visit(root);return lines;
  }

        `${actions}${numericArea}
          <p class="freeway-help">💗 Du entscheidest über die Teilrechnungen – die Hilfen sind freiwillig.</p>
          <div class="help-buttons"><button class="help-button thought" type="button" data-hint>💡 ${state.hintLevel===0?'Denktipp':state.hintLevel===1?'Noch ein Tipp':'Tipps ansehen'}</button><button class="help-button magic" type="button" data-magic>🪄 Eine Rechenidee</button></div>
          <button class="rescue-button" type="button" data-rescue>🛟 ${state.rescueOpen?'Hilfe schließen':'Hilfe, ich komme nicht weiter'}</button>
          ${state.hintLevel?`<div class="hint-box" role="note"><strong>💡 Denktipp ${state.hintLevel}:</strong> ${hintTexts[state.hintLevel-1]}</div>`:''}
          ${magicBox}${rescuePanel}`}
      </section>`;
  }

  function renderPlay() {
    if(state.mode==='div')return renderDivision();
    if(state.mode==='mul')return renderMultiplication();
    const p=state.examples[state.current],step=state.steps[state.step],total=state.examples.length;
    const magic=magicFor(state.mode,p),eq=mathText();
    const magicContent=magic.lines?`<ol class="magic-list">${magic.lines.map(line=>`<li>${line}</li>`).join('')}</ol>`:`<p>${magic.text}</p>`;
    const magicBox=state.magicOpen?`<div class="magic-box" role="note"><strong>🪄 ${magic.title}</strong>${magicContent}${magic.example?`<small>${magic.example}</small>`:''}</div>`:'';
    const plan=learningPlan(state.mode,p);
    const hasSubsteps=state.mode!=='tab';
    const rowPicker=state.mode==='tab' ? `<div class="row-choose"><label for="row-select">Welche Einmaleins-Reihe möchtest du üben?</label><select id="row-select" aria-label="Einmaleins-Reihe wählen">${Array.from({length:12},(_,i)=>i+2).map(n=>`<option value="${n}" ${n===state.row?'selected':''}>${n}er-Reihe</option>`).join('')}</select></div>` : '';
    const story=state.mode==='tab' ? '' : storyMarkup(p.story);
    const hopBoard=state.mode==='tab'?`<div class="hop-board"><strong>👣 Wähle eine Karte: Am Computer bewegst du die Fußspuren mit der Maus und klickst. Am Handy tippst du mit dem Finger.</strong><div class="hop-grid">${state.examples.map((item,i)=>`<button type="button" data-tab-index="${i}" class="hop-tile ${i===state.current?'selected':''} ${state.tabDone.includes(i)?'completed':''}" ${state.tabDone.includes(i)?'disabled':''} aria-label="${item.b} mal ${item.a}${i===state.current?', ausgewählt':''}${state.tabDone.includes(i)?', gelöst':''}" aria-pressed="${i===state.current}"><span>${item.b} × ${item.a}</span><small>${state.tabDone.includes(i)?'✓':i===state.current?'♥':'♡'}</small></button>`).join('')}</div></div>`:'';
    const stepTracker=hasSubsteps?`<div class="step-tracker"><div class="step-tracker-title"><strong>Schritt ${state.step+1} von ${state.steps.length}</strong><span>${plan.labels[state.step]}</span></div><div class="progress-track" role="progressbar" aria-label="Rechenschritte" aria-valuemin="0" aria-valuemax="${state.steps.length}" aria-valuenow="${state.step+(state.solved?1:0)}">${state.steps.map((_,i)=>`<span class="progress-cell ${i<state.step||(i===state.step&&state.solved)?'done':i===state.step?'current':''}"></span>`).join('')}</div></div>`:'';
    const rescuePanel=state.rescueOpen&&!state.solved?`<div class="rescue-panel" role="region" aria-label="Rettungshilfe"><h4>🛟 Wir schauen es uns gemeinsam an</h4><span class="rescue-stage">Erklärung ${state.rescueLevel+1} von 3</span><p class="rescue-story">${rescueGuide()[state.rescueLevel]}</p>
       ${state.rescueLevel<2?'<button type="button" class="rescue-next" data-rescue-more>Erkläre es mir noch genauer →</button>':
       '<button type="button" class="rescue-next" data-together>🤝 Zeig mir die Antwort für diesen Schritt</button>'}
       <p class="rescue-reminder">Du kannst jederzeit oben deine eigene Antwort eingeben.</p></div>`:'';
    const keys=[1,2,3,4,5,6,7,8,9,'back',0,'check'];
    const pad=keys.map(k=>k==='back' ? '<button class="key delete" type="button" data-erase aria-label="Letzte Ziffer löschen">⌫</button>'
      : k==='check' ? '<button class="key check" type="button" data-check aria-label="Antwort prüfen">✓</button>'
      : `<button class="key" type="button" data-digit="${k}">${k}</button>`).join('');
    return `<div class="activity-top"><button class="back" type="button" data-home>← Startseite</button><div class="activity-tools"><button class="sound-toggle" type="button" data-sound aria-pressed="${state.soundEnabled}">${state.soundEnabled?'🔊 Ton ausschalten':'🔇 Ton einschalten'}</button>${state.soundEnabled?'<button class="sound-toggle" type="button" data-test-sound>🔔 Testton</button>':''}<button class="skip-button" type="button" data-skip title="Diese Aufgabe auslassen und eine neue bekommen">↪ Andere Aufgabe</button><span class="round-count">${state.mode==='tab'?`${state.tabDone.length} von 10 geschafft`:`Aufgabe ${state.current+1} von ${total}`}</span></div></div>
      <div class="activity-heading"><span class="overline">${({div:'Geteilt-Land',mul:'Mal-Land',tab:'Zahlen-Hüpfspiel'})[state.mode]} ✨</span></div>
      ${rowPicker}
      ${hopBoard}
      <section class="task-card updated-task" aria-label="Rechenschritt">
        ${hasSubsteps?`<div class="story-panel story-at-top"><div class="story-heading">🌸 Die Geschichte dazu</div>${story}${scene(p)}</div>`:''}
        ${hasSubsteps ? `<div class="whole-task"><span class="whole-task-label">Unsere Gesamtaufgabe</span><h2 class="whole-task-equation">${eq} = ?</h2></div>
          ${stepTracker}
          <h3 class="main-question">${step.question}</h3>`
          : `<div class="card-current-label">Diese Karte rechnest du jetzt:</div><h2 class="main-question">${step.question}</h2>`}
        ${step.detail?`<p class="step-detail">${step.detail}</p>`:''}
        <div class="answer-section"><span class="answer-label">Deine Antwort</span><div class="answer-screen ${state.solved?'solved':''}" aria-live="polite">${state.entry||'<span class="answer-placeholder">?</span>'}</div></div>
        ${state.solved ? `<div class="correct-result"><span class="heart-celebration" aria-hidden="true">💖 🌟 💗</span><p class="feedback success" role="status">${state.feedback}</p><div class="equation-steps">${step.solvedLine}</div></div>
          <button type="button" class="help-button magic solved-magic" data-magic>🪄 ${state.magicOpen?'Zaubertrick einklappen':'Zaubertrick entdecken'}</button>
          ${magicBox}
          ${hasSubsteps&&state.step+1===state.steps.length?workingSummary(p):''}
          <button type="button" class="continue" data-next>${state.mode==='tab'?'Nächste Karte →':state.step+1===state.steps.length?'Nächste Aufgabe →':'Weiter zum nächsten Schritt →'}</button>`
          : `${state.feedback?`<p class="feedback" role="status">${state.feedback}</p>`:''}
          <div class="num-pad" aria-label="Zahl eingeben">${pad}</div>
          <div class="help-buttons"><button type="button" class="help-button thought" data-hint>💡 ${state.hintLevel===0?'Denktipp':state.hintLevel===1?'Noch ein Tipp':'Tipps ansehen'}</button><button type="button" class="help-button magic" data-magic>🪄 Zaubertrick</button></div>
          <button type="button" class="rescue-button" data-rescue>🛟 ${state.rescueOpen?'Hilfe schließen':'Hilfe, ich komme nicht weiter'}</button>
          ${state.hintLevel>0?`<div class="hint-box" role="note"><strong>💡 Denktipp ${state.hintLevel}:</strong> ${step.hints[state.hintLevel-1]}</div>`:''}
          ${magicBox}
          ${rescuePanel}
          ${state.hintLevel===2&&!state.rescueOpen?'<p class="hint-followup">Du brauchst mehr Hilfe? Öffne den Rettungsring. Dort erklären wir die Rechnung Schritt für Schritt.</p>':''}`}
      </section>`;
  }

  function renderFinish() {
    return `<section class="finish pink-finish"><div class="finish-graphic">🌸💖🌟</div><span class="eyebrow">Super gemacht!</span>
      <h1>Deine Runde im Zahlenland ist geschafft, Rosalie!</h1>
      <p><strong>${state.sessionStats.done} gelöst</strong> · <strong>${state.sessionStats.skipped} übersprungen</strong>. 💗</p>
      <div class="finish-signoff">💗 Deine Augen dürfen jetzt eine Pause machen. Schau in die Ferne oder geh eine Runde nach draußen!</div>
      <button type="button" class="continue" data-repeat>Noch eine Runde mit neuen Zahlen →</button>
      <button type="button" class="continue" data-home>Zurück ins Zahlenland</button></section>`;
  }
  function render() {app.innerHTML=state.screen==='home'?renderHome():state.screen==='play'?renderPlay():renderFinish();}

  app.addEventListener('click',e=>{
    const button=e.target.closest('button');if(!button)return;
    if(button.hasAttribute('data-home'))return home();
    if(button.hasAttribute('data-repeat'))return start(state.mode);
    if(button.hasAttribute('data-mode'))return start(button.dataset.mode);
    if(button.hasAttribute('data-tab-index'))return chooseTab(Number(button.dataset.tabIndex));
    if(button.hasAttribute('data-skip'))return skip();
    if(button.hasAttribute('data-digit'))return addDigit(button.dataset.digit);
    if(button.hasAttribute('data-erase'))return erase();
    if(button.hasAttribute('data-check'))return check();
    if(button.hasAttribute('data-next'))return next();
    if(button.hasAttribute('data-mul-action'))return mulAction(button.dataset.mulAction);
    if(button.hasAttribute('data-direct'))return changeDivisionPath(state.division.phase!=='direct');
    if(button.hasAttribute('data-hint'))return help();
    if(button.hasAttribute('data-magic')){state.magicOpen=!state.magicOpen;if(state.mode==='div'&&state.magicOpen)state.division.usedHelp=true;if(state.mode==='mul'&&state.magicOpen)state.multiplication.usedHelp=true;render();return;}
    if(button.hasAttribute('data-sound')){state.soundEnabled=!state.soundEnabled;playSound('toggle');render();return;}
    if(button.hasAttribute('data-test-sound')){playSound('success');return;}
    if(button.hasAttribute('data-rescue'))return rescue();
    if(button.hasAttribute('data-rescue-more'))return rescueMore();
    if(button.hasAttribute('data-together'))return solveTogether();
  });
  app.addEventListener('change',e=>{
    if(e.target.id==='row-select'){state.row=Number(e.target.value);start('tab');}
  });
  document.addEventListener('keydown',e=>{
    if(state.screen!=='play'||state.solved||e.altKey||e.ctrlKey||e.metaKey||e.repeat)return;
    const t=e.target;if(t&&['SELECT','INPUT','TEXTAREA'].includes(t.tagName))return;
    if(/^\d$/.test(e.key)){e.preventDefault();addDigit(e.key);}
    else if(e.key==='Backspace'){e.preventDefault();erase();}
    else if(e.key==='Enter'){e.preventDefault();check();}
  });
  document.getElementById('brand-home').addEventListener('click',home);
  render();

  /* Exposes pure game logic to the local test harness; never transmits data. */
  if(typeof window!=='undefined'&&window.location?.hostname==='localhost')window.__zahleninselTest={state,getSteps,magicFor,start,newExample,render,addDigit,check,checkDivision,changeDivisionPath,divisionHints,help,solveTogether,next,skip,selectExamples,chooseTab,rescue,rescueMore,rescueExplanation,rescueGuide,mulAction,checkMultiplication,currentMulNode,mulHints,mulRescueGuide,scene,storyMarkup,home,DIV,MUL};
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initZahlenland, {once:true});
} else {
  initZahlenland();
}

</script>
  </head>
  <body>
    <div class="site-shell">
      <header class="topbar">
        <button class="brand" id="brand-home" type="button" aria-label="Zur Startseite">
          <span class="brand-icon" aria-hidden="true">✳</span>
          <span>ROSALIES <b>ZAHLENLAND</b></span>
        </button>
      </header>
      <main id="app" aria-live="off"></main>
    </div>
  </body>
</html>
